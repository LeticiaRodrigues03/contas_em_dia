name: contas_em_dia
description: "App para organização e controle de contas pessoais."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  sqflite: ^2.0.0+4
  path: ^1.8.3
  flutter_local_notifications: ^19.5.0
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_native_timezone: ^2.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# 🔹 ÍCONE DO APP (Launcher Icon)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21

# 🔹 SPLASH SCREEN (Tela de abertura)
flutter_native_splash:
  color: "#E8F5E9"
  image: assets/icon/app_logo.png
  android: true
  ios: true

  android_12:
    color: "#E8F5E9"
    image: assets/icon/app_logo.png


dependency_overrides:
  flutter_native_timezone:
    path: plugins/flutter_native_timezone
